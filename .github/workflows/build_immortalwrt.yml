name: Build ImmortalWrt for Google Wifi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3

      - name: Download and Extract ImageBuilder
        run: |
          BUILDER_URL="https://downloads.immortalwrt.org/releases/24.10.3/targets/ipq40xx/chromium/immortalwrt-image-builder-24.10.3-ipq40xx-chromium.Linux-x86_64.tar.xz"
          
          wget "$BUILDER_URL" -O builder.tar.xz
          tar -xf builder.tar.xz
          rm builder.tar.xz
          mv immortalwrt-image-builder-* builder

      - name: Build Custom Firmware
        run: |
          cd builder
          make image \
            PROFILE="google_wifi" \
            PACKAGES="luci luci-ssl htop nano" \
            DISABLED_PACKAGES=""

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-google-wifi-gale
          path: builder/bin/targets/ipq40xx/chromium/*.bin
