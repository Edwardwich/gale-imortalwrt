name: Build ImmortalWrt Google Wifi (Gale)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt Version (snapshot or 24.10.5)'
        required: true
        default: 'snapshot'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk g++ git gettext libssl-dev python3-setuptools rsync swig unzip file wget

      - name: Download Image Builder
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TARGET="ipq40xx"
          SUBTARGET="chromium"
          
          if [ "$VERSION" = "snapshot" ]; then
            URL="https://downloads.immortalwrt.org/snapshots/targets/$TARGET/$SUBTARGET/immortalwrt-image-builder-$TARGET-$SUBTARGET.Linux-x86_64.tar.xz"
          else
            URL="https://downloads.immortalwrt.org/releases/$VERSION/targets/$TARGET/$SUBTARGET/immortalwrt-image-builder-$VERSION-$TARGET-$SUBTARGET.Linux-x86_64.tar.xz"
          fi

          echo "[*] Downloading Builder from: $URL"
          wget -q "$URL" -O builder.tar.xz || { echo "[-] Download failed! Check version string."; exit 1; }

          mkdir builder
          tar -xf builder.tar.xz -C builder --strip-components=1

      - name: Build Firmware with All Custom Packages
        run: |
          cd builder
          
          ALL_PACKAGES="apk-openssl ath10k-board-qca4019 ath10k-firmware-qca4019-ct autocore automount base-files block-mount ca-bundle default-settings-chn dnsmasq-full dropbear firewall4 fstools kmod-ath10k-ct kmod-gpio-button-hotplug kmod-leds-gpio kmod-nf-nathelper kmod-nft-offload kmod-usb-dwc3 kmod-usb-dwc3-qcom kmod-usb3 libc libgcc libustream-openssl logd luci luci-app-cpufreq mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail uboot-envtools uci uclient-fetch urandom-seed urngd wpad-openssl partx-utils mkf2fs e2fsprogs kmod-fs-ext4 kmod-fs-f2fs kmod-google-firmware kmod-ramoops sing-box ip-full kmod-tun luci-app-homeproxy nano btop iperf3"

          echo "[*] Compiling router firmware for google_gale..."
          make image PROFILE="google_gale" PACKAGES="$ALL_PACKAGES"
          
          mkdir -p ../firmware_output
          cp bin/targets/ipq40xx/chromium/* ../firmware_output/ || cp -r bin/targets/*/*/* ../firmware_output/ || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-google-wifi-gale
          path: firmware_output/
