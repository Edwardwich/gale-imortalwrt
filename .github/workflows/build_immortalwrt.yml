name: Build ImmortalWrt Google Wifi (Gale)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt Version (e.g., snapshot or 24.10.2)'
        required: true
        default: 'snapshot'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          df -h

      - name: Run ImmortalWrt Image Builder via Docker
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TARGET="ipq40xx"
          SUBTARGET="generic"
          PROFILE="google_gale"  # Image builder profile format usually replaces commas/hyphens with underscores
          
          # Packages to add
          PACKAGES="iperf3 sing-box ip-full kmod-tun luci-app-homeproxy"
          
          echo "[*] Pulling ImmortalWrt Image Builder container..."
          docker pull immortalwrt/imagebuilder:${VERSION}-${TARGET}-${SUBTARGET} || docker pull immortalwrt/imagebuilder:snapshot-${TARGET}-${SUBTARGET}

          echo "[*] Starting firmware compilation..."
          mkdir -p output

          # Run the image builder container
          docker run --rm \
            -v "$(pwd)/output:/builder/bin" \
            immortalwrt/imagebuilder:snapshot-${TARGET}-${SUBTARGET} \
            make image PROFILE="${PROFILE}" PACKAGES="${PACKAGES}" EXTRA_IMAGE_NAME="custom-gale"
            
          echo "[+] Build process completed."

      - name: Verify Output Files
        run: ls -la output/targets/*/*/* || ls -la output/

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-google-wifi-gale
          path: output/targets/**/*
