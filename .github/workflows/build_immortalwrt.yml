name: Build ImmortalWrt Google Wifi (Gale)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'ImmortalWrt Version (e.g., 25.12.1 or snapshot)'
        required: true
        default: '25.12.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk g++ git gettext libssl-dev python3-setuptools rsync swig unzip file wget

      - name: Download and Extract Image Builder
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TARGET="ipq40xx"
          SUBTARGET="generic"
          
          if [ "$VERSION" = "snapshot" ]; then
            URL="https://downloads.immortalwrt.org/snapshots/targets/$TARGET/$SUBTARGET/immortalwrt-image-builder-$TARGET-$SUBTARGET.Linux-x86_64.tar.xz"
          else
            URL="https://downloads.immortalwrt.org/releases/$VERSION/targets/$TARGET/$SUBTARGET/immortalwrt-image-builder-$VERSION-$TARGET-$SUBTARGET.Linux-x86_64.tar.xz"
          fi

          echo "[*] Downloading Image Builder from: $URL"
          wget -q "$URL" -O builder.tar.xz
          
          mkdir builder
          tar -xf builder.tar.xz -C builder --strip-components=1
          cd builder
          make clean

      - name: Compile Custom Firmware
        run: |
          cd builder
          
          PROFILE="google_gale"
          PACKAGES="iperf3 sing-box ip-full kmod-tun luci-app-homeproxy"
          
          echo "[*] Building firmware for profile: $PROFILE"
          make image PROFILE="$PROFILE" PACKAGES="$PACKAGES" EXTRA_IMAGE_NAME="custom-gale"
          
          mkdir -p ../firmware_output
          cp bin/targets/ipq40xx/generic/* ../firmware_output/ || cp -r bin/targets/*/*/* ../firmware_output/ || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-google-wifi-gale
          path: firmware_output/
